# Netlify config for the XAPPX front-end (apps/web is the deploy base).
# Only used by Netlify; Render deploys are unaffected (render.yaml).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # SMTP_USER holds the public team address (info.xappx@gmail.com), which also
  # appears in page copy. It is not a secret; without this the secrets scanner
  # fails every build that mentions the address.
  SECRETS_SCAN_OMIT_KEYS = "SMTP_USER"

# Server-side discovery proxy (holds ANTHROPIC_API_KEY; never exposed to the browser).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Admin console under the public domain: xappx.ai/admin proxies to the
# app-factory service (which serves itself under /admin via FACTORY_BASE_PATH).
# Must come before the SPA catch-all. status 200 = transparent proxy.
[[redirects]]
  from = "/admin"
  to = "https://app-factory-3jf3.onrender.com/admin/"
  status = 200
  force = true
[[redirects]]
  from = "/admin/*"
  to = "https://app-factory-3jf3.onrender.com/admin/:splat"
  status = 200
  force = true

# SPA routing so /build (and any client route) resolves to the app.
# Function routes (/.netlify/functions/*) are handled before this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
