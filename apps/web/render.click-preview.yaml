# Optional, standalone Blueprint for a NEW preview only. Never sync root render.yaml.
# Check service-name availability and workspace charges before any creation/sync.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    runtime: static
    name: xappx-click-preview
    repo: https://github.com/billinmanorg/xappx-platform
    branch: preview/xappx-click-first
    rootDir: apps/web
    buildCommand: npm ci && npm run build:click-preview && npm run check:click-preview
    staticPublishPath: dist-click-preview
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22.23.3'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    routes:
      - type: rewrite
        source: /build
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; worker-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
