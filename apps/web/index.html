<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XAPPX · Turn a business problem into an AI solution</title>
    <meta name="description" content="Tell XAPPX what isn't working. We help identify the opportunity, design the solution, and generate an intelligent working prototype." />
    <meta name="theme-color" content="#070A10" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  </head>
  <body>
    <!-- Hidden static form so Netlify Forms registers it at build time; the
         React lead form posts to it. Set the notification email (xappx@gmail.com)
         in Netlify -> Forms -> Notifications. -->
    <form name="xappx-lead" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
      <input type="text" name="industry" />
      <input type="text" name="challenge" />
      <input type="text" name="stakeholders" />
      <input type="text" name="outcomes" />
      <input type="text" name="blueprint" />
      <input type="text" name="submitted-at" />
      <input type="text" name="bot-field" />
    </form>
    <!-- Data-licensing intake store (Netlify Forms). Posted to by the
         data-licensing function only; the page never posts here directly. -->
    <form name="xappx-data-licensing" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="submissionId" />
      <input type="text" name="noticeVersion" />
      <input type="text" name="completedBy" />
      <input type="text" name="completedByRole" />
      <input type="text" name="businessName" />
      <input type="text" name="legalName" />
      <input type="text" name="relatedEntities" />
      <input type="text" name="hqState" />
      <input type="text" name="usDomicile" />
      <input type="text" name="ownershipType" />
      <input type="text" name="industry" />
      <input type="text" name="subVertical" />
      <input type="text" name="franchise" />
      <input type="text" name="contactName" />
      <input type="text" name="contactTitle" />
      <input type="text" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="decisionRole" />
      <input type="text" name="referral" />
      <input type="text" name="website" />
      <input type="text" name="linkedin" />
      <textarea name="description"></textarea>
      <input type="text" name="customerTypes" />
      <input type="text" name="engagement" />
      <input type="text" name="desk" />
      <input type="text" name="nonDesk" />
      <input type="text" name="totalHeadcount" />
      <input type="text" name="peakHeadcount" />
      <input type="text" name="operatingStatus" />
      <input type="text" name="foundedYear" />
      <input type="text" name="earliestRecords" />
      <input type="text" name="recordsFrom" />
      <input type="text" name="recordsTo" />
      <input type="text" name="staffGeography" />
      <input type="text" name="dataLanguage" />
      <input type="text" name="coverageEmail" />
      <input type="text" name="coverageChat" />
      <input type="text" name="coverageFiles" />
      <input type="text" name="rightsKnown" />
      <input type="text" name="restrictions" />
      <input type="text" name="sensitive" />
      <input type="text" name="retention" />
      <input type="text" name="priorLicensing" />
      <input type="text" name="revenueRange" />
      <input type="text" name="currency" />
      <input type="text" name="fiscalYear" />
      <input type="text" name="needHelpIdentifying" />
      <textarea name="systems"></textarea>
      <input type="text" name="estimateIndustry" />
      <input type="text" name="estimateDesk" />
      <input type="text" name="estimateNonDesk" />
      <input type="text" name="estimateYears" />
      <input type="text" name="rightsAnswer" />
      <input type="text" name="authority" />
      <input type="text" name="privacyAck" />
      <input type="text" name="record-id" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- XAPPY floating chat (retained). Same-domain deploy keeps the approved
         origin, so the chat works exactly as it does today. -->
    <script src="/xappy-widget.js" defer></script>
    <script src="/cookies.js" defer></script>
  </body>
</html>
