<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XAPPX · Turn a business problem into an AI solution</title>
    <meta name="description" content="Tell XAPPX what isn't working. We help identify the opportunity, design the solution, and generate an intelligent working prototype." />
    <meta name="theme-color" content="#070A10" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  </head>
  <body>
    <!-- Hidden static form so Netlify Forms registers it at build time; the
         React lead form posts to it. Set the notification email (xappx@gmail.com)
         in Netlify -> Forms -> Notifications. -->
    <form name="xappx-lead" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
      <input type="text" name="industry" />
      <input type="text" name="challenge" />
      <input type="text" name="stakeholders" />
      <input type="text" name="outcomes" />
      <input type="text" name="blueprint" />
      <input type="text" name="submitted-at" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- XAPPY floating chat (retained). Same-domain deploy keeps the approved
         origin, so the chat works exactly as it does today. -->
    <script src="/xappy-widget.js" defer></script>
    <script src="/cookies.js" defer></script>
  </body>
</html>
