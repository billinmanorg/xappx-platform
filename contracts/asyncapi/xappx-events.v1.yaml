    channel:
      $ref: '#/channels/media'
  publish_referrals:
    action: send
    channel:
      $ref: '#/channels/referrals'
  publish_rewards:
    action: send
    channel:
      $ref: '#/channels/rewards'
  publish_twins:
    action: send
    channel:
      $ref: '#/channels/twins'
  publish_vault:
    action: send
    channel:
      $ref: '#/channels/vault'
  receive_ApplicationProductDisabled_agents_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: agents-service consumes com.xappx.application.product.disabled.
  receive_TwinReady_agents_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: agents-service consumes com.xappx.twin.ready.
  consume_all_audit_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: audit-service subscribes to every topic.
  receive_ApplicationProductDisabled_billing_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: billing-service consumes com.xappx.application.product.disabled.
  receive_ApplicationProductDisabled_communities_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: communities-service consumes com.xappx.application.product.disabled.
  consume_all_events_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: events-service subscribes to every topic.
  receive_ApplicationCreated_identity_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: identity-service consumes com.xappx.application.created.
  receive_UserCreated_referrals_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: referrals-service consumes com.xappx.user.created.
  receive_UserCreated_rewards_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: rewards-service consumes com.xappx.user.created.
  receive_ReferralConverted_rewards_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: rewards-service consumes com.xappx.referral.converted.
  receive_ContentPublished_rewards_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: rewards-service consumes com.xappx.content.published.
  receive_ApplicationProductDisabled_twins_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: twins-service consumes com.xappx.application.product.disabled.
  receive_VaultItemStored_twins_service:
    action: receive
    channel:
      $ref: '#/channels/vault'
    description: twins-service consumes com.xappx.vault.item.stored.
  receive_ApplicationProductDisabled_vault_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: vault-service consumes com.xappx.application.product.disabled.
  receive_SubscriptionDowngraded_vault_service:
    action: receive
    channel:
      $ref: '#/channels/agents'
    description: vault-service consumes com.xappx.subscription.downgraded.
