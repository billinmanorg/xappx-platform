asyncapi: 3.0.0
info:
  title: XAPPX Platform Events
  version: 1.0.0
  description: Every event is a CloudEvents v1.0 JSON envelope. Producers publish
    through their transactional outbox; consumers deduplicate on the event id because
    delivery is at-least-once. Adding a field is a compatible change; changing a meaning
    requires a new event type. This file is generated from the service manifests -
    edit those, not this.
defaultContentType: application/cloudevents+json
channels:
  agents:
    address: xappx.agents
    messages:
      AgentCreated:
        $ref: '#/components/messages/AgentCreated'
  ai_orchestrator:
    address: xappx.ai_orchestrator
    messages:
      AiRequestCompleted:
        $ref: '#/components/messages/AiRequestCompleted'
  billing:
    address: xappx.billing
    messages:
      SubscriptionChanged:
        $ref: '#/components/messages/SubscriptionChanged'
      SubscriptionDowngraded:
        $ref: '#/components/messages/SubscriptionDowngraded'
  campaigns:
    address: xappx.campaigns
    messages:
      ContentPublished:
        $ref: '#/components/messages/ContentPublished'
      CampaignStarted:
        $ref: '#/components/messages/CampaignStarted'
  clients:
    address: xappx.clients
    messages:
      ClientCreated:
        $ref: '#/components/messages/ClientCreated'
      ApplicationCreated:
        $ref: '#/components/messages/ApplicationCreated'
      ApplicationPublished:
        $ref: '#/components/messages/ApplicationPublished'
      ApplicationProductEnabled:
        $ref: '#/components/messages/ApplicationProductEnabled'
      ApplicationProductDisabled:
        $ref: '#/components/messages/ApplicationProductDisabled'
  communities:
    address: xappx.communities
    messages:
      CommunityJoined:
        $ref: '#/components/messages/CommunityJoined'
      PostCreated:
        $ref: '#/components/messages/PostCreated'
  export:
    address: xappx.export
    messages:
      ExportCompleted:
        $ref: '#/components/messages/ExportCompleted'
  identity:
    address: xappx.identity
    messages:
      UserCreated:
        $ref: '#/components/messages/UserCreated'
      MembershipCreated:
        $ref: '#/components/messages/MembershipCreated'
      UserDisabled:
        $ref: '#/components/messages/UserDisabled'
  media:
    address: xappx.media
    messages:
      MediaGenerated:
        $ref: '#/components/messages/MediaGenerated'
  referrals:
    address: xappx.referrals
    messages:
      ReferralRegistered:
        $ref: '#/components/messages/ReferralRegistered'
      ReferralQualified:
        $ref: '#/components/messages/ReferralQualified'
      ReferralConverted:
        $ref: '#/components/messages/ReferralConverted'
  rewards:
    address: xappx.rewards
    messages:
      RewardEarned:
        $ref: '#/components/messages/RewardEarned'
      RewardApproved:
        $ref: '#/components/messages/RewardApproved'
      RewardReversed:
        $ref: '#/components/messages/RewardReversed'
  twins:
    address: xappx.twins
    messages:
      TwinCreated:
        $ref: '#/components/messages/TwinCreated'
      TwinReady:
        $ref: '#/components/messages/TwinReady'
  vault:
    address: xappx.vault
    messages:
      VaultCreated:
        $ref: '#/components/messages/VaultCreated'
      VaultItemStored:
        $ref: '#/components/messages/VaultItemStored'
      VaultRetentionExpired:
        $ref: '#/components/messages/VaultRetentionExpired'
      VaultRetentionOpened:
        $ref: '#/components/messages/VaultRetentionOpened'
operations:
  publish_agents:
    action: send
    channel:
      $ref: '#/channels/agents'
  publish_ai_orchestrator:
    action: send
    channel:
      $ref: '#/channels/ai_orchestrator'
  publish_billing:
    action: send
    channel:
      $ref: '#/channels/billing'
  publish_campaigns:
    action: send
    channel:
      $ref: '#/channels/campaigns'
  publish_clients:
    action: send
    channel:
      $ref: '#/channels/clients'
  publish_communities:
    action: send
    channel:
      $ref: '#/channels/communities'
  publish_export:
    action: send
    channel:
      $ref: '#/channels/export'
  publish_identity:
    action: send
    channel:
      $ref: '#/channels/identity'
  publish_media:
