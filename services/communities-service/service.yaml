# Service manifest. Declares what this service owns and what crosses its
# boundary. CI reads this: a PR adding a table that is not listed under
# owns, or an event not declared here, fails the boundary check.
name: communities-service
port: 8088
database: xappx_communities_service
owns: communities, community_members, posts
external_ids: app_id, user_id
publishes:
- com.xappx.community.joined
- com.xappx.post.created
consumes:
- com.xappx.application.product.disabled
health:
  liveness: /healthz
  readiness: /readyz
