apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator
  labels: { app: ai-orchestrator, part-of: xappx }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-orchestrator }
  template:
    metadata:
      labels: { app: ai-orchestrator }
    spec:
      containers:
        - name: ai-orchestrator
          image: ghcr.io/xappx/ai-orchestrator:latest
          ports:
            - containerPort: 8087
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: ai-orchestrator-db, key: url } }
            - name: BROKER_URL
              valueFrom: { secretKeyRef: { name: xappx-broker, key: url } }
            - name: SERVICE_NAME
              value: ai-orchestrator
          readinessProbe:
            httpGet: { path: /readyz, port: 8087 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8087 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestrator
spec:
  selector: { app: ai-orchestrator }
  ports:
    - port: 80
      targetPort: 8087
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-orchestrator
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
