name: xappx
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: xappx
      POSTGRES_USER: xappx
    ports:
    - 5432:5432
    volumes:
    - ./deploy/local/init-databases.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U xappx
      interval: 5s
      retries: 10
  nats:
    image: nats:2-alpine
    command: -js
    ports:
    - 4222:4222
    - 8222:8222
  gateway:
    build: ./gateway
    ports:
    - 8080:8080
    environment:
      BROKER_URL: nats://nats:4222
    depends_on:
    - nats
  clients-service:
    build: ./services/clients-service
    environment:
      DATABASE_URL: postgres://xappx:xappx@postgres:5432/xappx_clients_service
      BROKER_URL: nats://nats:4222
      SERVICE_NAME: clients-service
      PORT: '8081'
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
    - 8081:8081
  identity-service:
    build: ./services/identity-service
    environment:
      DATABASE_URL: postgres://xappx:xappx@postgres:5432/xappx_identity_service
      BROKER_URL: nats://nats:4222
      SERVICE_NAME: identity-service
      PORT: '8082'
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
    - 8082:8082
  vault-service:
